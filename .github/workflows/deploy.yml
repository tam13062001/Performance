name: Deploy Next.js to Hostinger

on:
  push:
    branches:
      - main # Tự động chạy khi push lên nhánh main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Bạn có thể đổi phiên bản Node cho phù hợp với máy của bạn

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏗️ Build Project
        run: npm run build
        # Lệnh này sẽ tạo ra thư mục "out" chứa toàn bộ file tĩnh nhờ cấu hình ở Bước 1

      - name: 📂 Sync files to Hostinger FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/           # Lấy code đã build từ thư mục out
          server-dir: ./public_html/  # Đẩy thẳng vào thư mục public_html trên Hostinger